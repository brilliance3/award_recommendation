# Fly.io 배포 설정 - 무료 한도 내에서 동작하도록 구성
# 처음 한 번: `flyctl launch --no-deploy --copy-config` 로 앱 이름만 정하고
# 그 다음 `flyctl secrets set ...` 후 `flyctl deploy`

app = "award-recommendation"            # 배포 시 본인 앱 이름으로 수정
primary_region = "nrt"                  # 도쿄 (한국에서 가장 빠름)
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  PDF_ENGINE = "playwright"
  STORAGE_DIR = "/data"
  PYTHONUNBUFFERED = "1"

# 영구 볼륨 (생성된 PDF/XLSX, 업로드 파일 저장)
# 처음 한 번: `flyctl volumes create award_data --size 1 --region nrt`
[[mounts]]
  source = "award_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"           # 트래픽 없으면 정지 (무료 한도 절약)
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"                      # Playwright 안정 동작 권장 최소치
  cpu_kind = "shared"
  cpus = 1
